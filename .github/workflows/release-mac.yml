name: Release Mac

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: https://fwsmllrlevehhxdtzzkk.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3

      - name: Prepare cloud env
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_ANON_KEY repo secret — cloud build will fall back to local mode."
            cp .env.example .env
          else
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          fi

      - name: Build and package
        run: npm run release:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rollout-Studio-mac
          path: |
            release/*.zip
            release/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.dmg
          generate_release_notes: true
